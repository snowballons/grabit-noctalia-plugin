# Grabit Launcher - launches grabit for screenshots, screen recording, OCR, and uploads.
#
# grabit handles the interactive UI (region selector, annotator, recording control bar);
# this plugin provides a bar button, a mode menu, and recording-state mirroring.
#
plugin_api = 42
# process matching. The widget and shortcut are thin clients that mirror the
# published "status" and drive grabit by writing to the "command" channel.

id = "snowballons/grabit"
name = "Grabit Launcher"
version = "1.0.0"
author = "snowballons"
license = "MIT"
dependencies = ["grabit"]
tags = ["screenshot", "screen-recording", "ocr", "upload"]
icon = "screenshot"
description = "Launch grabit for screenshots, screen recording, OCR, and uploads."

# ── Plugin settings ──────────────────────────────────────────────

[[setting]]
key = "default_action"
type = "select"
label_key = "settings.default_action.label"
description_key = "settings.default_action.description"
default = "copy"
options = [
  { value = "copy", label_key = "settings.default_action.options.copy" },
  { value = "save", label_key = "settings.default_action.options.save" },
  { value = "upload", label_key = "settings.default_action.options.upload" },
]

[[setting]]
key = "upload_service"
type = "string"
label_key = "settings.upload_service.label"
description_key = "settings.upload_service.description"
default = ""
# visible_when was previously restricted to default_action == "upload", but the
# menu's "Region (upload)" item uses upload_service regardless of default_action.
# Always show it so users can configure their uploader even when their default
# action is copy or save.

[[setting]]
key = "show_cursor"
type = "bool"
label_key = "settings.show_cursor.label"
description_key = "settings.show_cursor.description"
default = true

[[setting]]
key = "record_upload"
type = "bool"
label_key = "settings.record_upload.label"
description_key = "settings.record_upload.description"
default = true

[[setting]]
key = "hide_inactive"
type = "bool"
label_key = "settings.hide_inactive.label"
description_key = "settings.hide_inactive.description"
default = false

# ── Entries ──────────────────────────────────────────────────────

[[widget]]
id = "widget"
entry = "widget.luau"


[[service]]
id = "service"
entry = "service.luau"

[[shortcut]]
id = "shortcut"
entry = "shortcut.luau"

[[panel]]
id = "menu"
entry = "menu.luau"
width = 460
height = "content"
max_height = 500

[[panel]]
id = "settings"
entry = "settings.luau"
width = 420
height = "content"
max_height = 600

[[layer]]
id = "recording"
entry = "recording_layer.luau"
layer = "overlay"
anchors = ["top", "bottom", "left", "right"]
keyboard = "none"
click_through = true